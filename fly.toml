# Fly.io configuration for Unmute (₹0 Free Deployment)
app = "unmute-app"
primary_region = "bom" # Mumbai, India (or "sin" for Singapore)

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
