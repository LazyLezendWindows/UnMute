version: '3.8'

services:
  mariadb:
    image: mariadb:10.11
    container_name: unmute_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: unmute_root_password_change_me
      MARIADB_DATABASE: unmute_db
      MARIADB_USER: unmute_user
      MARIADB_PASSWORD: unmute_password_change_me
    volumes:
      - mariadb_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unmute_app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      TRUST_PROXY: "1"
      SESSION_COOKIE_SAMESITE: lax
      MARIADB_HOST: mariadb
      MARIADB_PORT: 3306
      MARIADB_USER: unmute_user
      MARIADB_PASSWORD: unmute_password_change_me
      MARIADB_DATABASE: unmute_db
      CORS_ORIGIN: http://localhost:5000
    ports:
      - "5000:5000"

volumes:
  mariadb_data:

